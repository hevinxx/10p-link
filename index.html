<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10p — 매일 조금씩 읽는 독서 기록</title>
<meta name="description" content="많이 읽지 않아도 괜찮아요. 오늘 읽은 만큼 기록하는 독서 앱, 10p.">
<meta property="og:title" content="10p">
<meta property="og:description" content="많이 읽지 않아도 괜찮아요. 오늘 읽은 만큼 기록해 보세요.">
<meta property="og:image" content="icon.png">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<script>
  // 휴대폰에서는 페이지를 보여주지 않고 바로 스토어로 보낸다(예전 Dynamic Links와 같은 동작).
  // PC이거나 이동이 막히면 아래 안내 페이지가 그대로 보인다.
  (function () {
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/.test(ua);
    if (location.search.indexOf("stay") !== -1) return; // 미리보기용: ?stay
    if (isIOS) location.replace("https://apps.apple.com/app/id1671311718");
    else if (isAndroid) location.replace("https://play.google.com/store/apps/details?id=io.hevinxx.one_o_p");
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --paper: #f6f4ef;
    --ink: #161616;
    --ink-sub: #5b5b5b;
    --accent: #0f4c81;
    --rule: #d9d5cc;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 360px; }
  .icon {
    width: 96px; height: 96px;
    border-radius: 22px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
  }
  h1 { font-size: 28px; font-weight: 700; margin-top: 20px; letter-spacing: -.01em; }
  .lead { font-size: 20px; font-weight: 600; line-height: 1.45; margin-top: 28px; }
  .sub { font-size: 15px; color: var(--ink-sub); line-height: 1.6; margin-top: 10px; }
  .stores { display: flex; flex-direction: column; gap: 12px; margin-top: 36px; }
  .store {
    display: block;
    padding: 15px 20px;
    border-radius: 999px;
    font-size: 16px; font-weight: 600;
    text-decoration: none;
    border: 1.5px solid var(--accent);
    color: var(--accent);
  }
  .store.primary { background: var(--accent); color: #fff; }
  footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--ink-sub); }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="10p 앱 아이콘">
  <h1>10p</h1>
  <p class="lead">많이 읽지 않아도 괜찮아요.<br>오늘 읽은 만큼 기록해 보세요.</p>
  <p class="sub">조금씩, 매일 이어 가는 독서 기록.</p>
  <div class="stores">
    <a class="store primary" href="https://apps.apple.com/app/id1671311718">App Store에서 받기</a>
    <a class="store" href="https://play.google.com/store/apps/details?id=io.hevinxx.one_o_p">Google Play에서 받기</a>
  </div>
  <footer><a href="https://www.instagram.com/10p.read/">@10p.read</a></footer>
</main>
</body>
</html>
